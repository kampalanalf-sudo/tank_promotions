name: Check and deploy TANK Tickets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BUILD_SHA: ${{ github.sha }}
      # Public origin of the separately deployed payments API, e.g. https://api.tanktickets.site
      # Set this in GitHub → Settings → Secrets and variables → Actions → Variables.
      # Leave unset only for local/same-origin API deployments.
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:build
      - run: npm run check:server
      - run: npm run test:server
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the published build is not cached
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location "https://tanktickets.site/?build=$GITHUB_SHA" | grep --fixed-strings "<meta name=\"tank-build\" content=\"$GITHUB_SHA\""; then
              exit 0
            fi
            sleep 10
          done
          echo "The published page did not expose this commit's build marker." >&2
          exit 1
